  - id: "config-test-suite-post-fix"
    command: "python -m pytest test/host/code_quality/test_config_files.py -v"
    exit_code: 0
    classification: "success"
    duration_seconds: 0.1
    log_reference: null
    notes: |
      All 15 config file tests pass:
        6 positive (real repo validation),
