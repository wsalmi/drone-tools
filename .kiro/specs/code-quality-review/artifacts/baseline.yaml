# ---------------------------------------------------------------------------
# Repetition Validation
# ---------------------------------------------------------------------------
# Property 1 requires that commands produce equivalent results in fresh
# directories on the same commit. Validated by running in two separate
# directories (build/host_baseline_1 and build/host_baseline_2).
# ---------------------------------------------------------------------------

repetition_validation:
  host_configure:
    run_1_exit_code: 0
    run_2_exit_code: 0
    equivalent: true
    notes: "Both runs configure successfully with identical warnings"

  host_build:
    run_1_exit_code: 2
    run_2_exit_code: 2
    equivalent: true
    notes: |
      Both runs fail identically at hal_lora_mock.c:9 with
      'hal_lora.h' file not found. The failure is deterministic and
      traceable to the same incorrect path in CMakeLists.txt.

  firmware_set_target:
    note: "Validated once; full firmware build takes ~4 minutes"
    run_1_exit_code: 0
    equivalent: true

  firmware_build:
    note: "Validated once; firmware build is deterministic for same IDF version"
    run_1_exit_code: 0
    equivalent: true

