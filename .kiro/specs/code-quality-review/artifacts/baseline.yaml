# ---------------------------------------------------------------------------
# Known Issues Captured in Baseline
# ---------------------------------------------------------------------------
# These are observations recorded for the findings inventory (Task 1.2).
# This baseline does not fix them; it preserves them as reproducible evidence.
# ---------------------------------------------------------------------------

known_issues:
  - id: "CQR-BUILD-001"
    title: "Host build references nonexistent components/hal instead of components/hw_hal"
    severity: "High"
    evidence:
      - "test/host/CMakeLists.txt:110 — ${COMPONENTS_DIR}/hal/include in hal_mocks"
      - "test/host/CMakeLists.txt:127 — ${COMPONENTS_DIR}/hal/include in COMPONENT_INCLUDE_DIRS"
    reproduction: "cmake -S test/host -B build/host && cmake --build build/host"
    observed_result: "exit code 2, fatal error: 'hal_lora.h' file not found"

  - id: "CQR-DOCS-001"
    title: "README references ./run_tests which does not exist"
    severity: "Medium"
    evidence:
      - "README.md testing section instructs: './run_tests'"
    reproduction: "Follow README testing instructions on a clean checkout"
    observed_result: "No script or target named run_tests exists"

  - id: "CQR-DOCS-002"
    title: "README references components/hal/ in project structure, not components/hw_hal/"
    severity: "Low"
    evidence:
      - "README.md project structure diagram lists 'hal/' instead of 'hw_hal/'"
    reproduction: "Compare README structure to actual filesystem"
    observed_result: "Mismatch between documented and actual component name"

  - id: "CQR-CI-001"
    title: "CI only runs firmware build; host tests are not executed"
    severity: "High"
    evidence:
      - ".github/workflows/build-and-release.yml — single 'build' job with idf.py build only"
    reproduction: "Review workflow file"
    observed_result: "No host-test, static-analysis, or host-build job"

  - id: "CQR-ENV-001"
    title: "Local ESP-IDF version (v5.5.0) differs from CI (v5.3)"
    severity: "Low"
    evidence:
      - "CI uses espressif/idf:v5.3 Docker image"
      - "Local PlatformIO installs framework-espidf v5.5.0"
    reproduction: "Compare idf.py --version output to CI container tag"
    observed_result: "Version mismatch; builds succeed on both but APIs may differ"
