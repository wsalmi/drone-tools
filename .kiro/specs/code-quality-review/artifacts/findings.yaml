# =============================================================================
# Schema enforcement (validated by tools/code_quality/ when implemented):
#
# CLOSED requires ALL of:
#   - root_cause: non-null
#   - remediation.change_refs: non-empty
#   - regression.test_ids: non-empty OR regression.defective_result documents equivalent proof
#   - verification.gates: all applicable gates green
#   - requirements: linked criteria satisfied
#
# ACCEPTED_RISK requires ALL of:
#   - owner: named individual or team
#   - accepted_risk.justification: non-empty rationale
#   - accepted_risk.review_condition: date or condition for reassessment
#   - accepted_risk.approval: documented approval reference
#   - severity: NOT Critical (Critical cannot be accepted)
#   - Does not turn a red gate green
#
# SKIPS / SUPPRESSIONS:
#   - Every test skip, diagnostic suppression, or intentional debt
#     must reference a CQR-* finding ID
