  - id: CQR-READY-001
    title: "app_main unconditionally announces 'Ready!' regardless of module initialization results"
    category: readiness
    severity: High
    severity_rationale:
      impact: "Operator sees 'Ready' when required subsystems have failed; masks degraded/failed state"
      probability: "Deterministic — Ready! is printed after all phases regardless of any error"
    status: OPEN
    owner: "main/readiness"
    baseline:
      commit: "3f5b8b3ad6276bb04352596291d78b925ab699f5"
      evidence:
        - {location: "main/main.c:app_main:ready_announcement", excerpt_hash: "unconditional_ready"}
      reproduction:
        - "Inspect app_main(): after all init phases complete, 'Ready! (%lums)' is displayed unconditionally at line ~385"
        - "No check: if any required subsystem failed, Ready is still shown"
      observed_result: "Display shows 'Ready!' even if HW Manager, Detection Service, or other required modules failed"
    current_evidence:
      - {commit: "3f5b8b3", location: "main/main.c:385"}
    root_cause: "No readiness evaluation logic; init phases log failures but do not aggregate into a readiness state"
    remediation:
      strategy: "Classify subsystems as required/optional; evaluate readiness from results; announce Ready only when all required are OPERATIONAL; else announce DEGRADED or FAILED"
