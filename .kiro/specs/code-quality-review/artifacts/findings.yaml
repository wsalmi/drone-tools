  - id: CQR-REMOTEID-001
    title: "Received CRC is calculated but never compared to frame CRC"
    category: parsing
    severity: High
    severity_rationale:
      impact: "Corrupted or spoofed packets with bad CRC are accepted as valid telemetry"
      probability: "Every frame from an untrusted source; integrity check is completely bypassed"
    status: OPEN
    owner: "services/remoteid"
    baseline:
      commit: "3f5b8b3ad6276bb04352596291d78b925ab699f5"
      evidence:
        - {location: "components/services/src/remoteid_decoder.c:remoteid_validate_frame", excerpt_hash: "no_crc_comparison"}
      reproduction:
        - "Inspect remoteid_validate_frame: CRC-8 table and remoteid_crc8() exist but validate_frame only checks message type, never compares calculated vs received CRC"
      observed_result: "remoteid_crc8() is defined but never invoked in the decode/validate path; frame validation uses message type check as a proxy"
    current_evidence:
      - {commit: "3f5b8b3", location: "components/services/src/remoteid_decoder.c:350-410"}
    root_cause: "CRC validation was implemented as a utility but never integrated into the frame validation or decode flow"
    remediation:
      strategy: "In remoteid_validate_frame and decode paths, calculate CRC over the protocol-defined region and compare to received CRC byte; reject on mismatch with RID_REJECT_CRC"
      change_refs: []
    regression:
      test_ids: []
      defective_result: "Frame with invalid CRC is accepted and decoded"
      remediated_result: "Frame with invalid CRC returns RID_REJECT_CRC; integrity_errors increments exactly once"
    requirements: ["5.3", "5.4", "5.9", "12.1", "12.4", "12.6"]
    verification:
      gates: {G2_host_fast: "pending", G3_security: "pending"}
      artifact_refs: []
    accepted_risk: null

  - id: CQR-REMOTEID-002
    title: "Coordinate validity uses logical OR instead of AND (lat OR lon != invalid)"
    category: parsing
    severity: High
    severity_rationale:
      impact: "Partial/invalid coordinates published as valid position; incorrect geolocation"
      probability: "Any frame where one coordinate is sentinel and the other is not"
    status: OPEN
    owner: "services/remoteid"
    baseline:
      commit: "3f5b8b3ad6276bb04352596291d78b925ab699f5"
      evidence:
        - {location: "components/services/src/remoteid_decoder.c:153", excerpt_hash: "has_position_or_logic"}
        - {location: "components/services/src/remoteid_decoder.c:172", excerpt_hash: "has_operator_location_or_logic"}
      reproduction:
        - "Inspect decode_location(): `out->has_position = (lat_raw != REMOTEID_LAT_INVALID || lon_raw != REMOTEID_LON_INVALID)`"
        - "Inspect decode_system(): `out->has_operator_location = (op_lat_raw != 0 || op_lon_raw != 0)`"
      observed_result: "A single valid coordinate (e.g., valid lat, invalid lon) sets has_position=true"
    current_evidence:
      - {commit: "3f5b8b3", location: "components/services/src/remoteid_decoder.c:153"}
      - {commit: "3f5b8b3", location: "components/services/src/remoteid_decoder.c:172"}
    root_cause: "Logical OR was used where AND is required; no range/sentinel validation per ASTM F3411"
    remediation:
      strategy: "Validate lat and lon independently for sentinel, scale, and intervals [-90,90]/[-180,180]; use AND to set has_position; same for operator location"
      change_refs: []
    regression:
      test_ids: []
      defective_result: "has_position=true with only one valid coordinate"
      remediated_result: "has_position=true only when BOTH lat and lon are individually valid"
    requirements: ["5.5", "5.6", "5.7", "12.1", "12.4"]
    verification:
      gates: {G2_host_fast: "pending"}
      artifact_refs: []
    accepted_risk: null

  - id: CQR-REMOTEID-003
    title: "No bounds validation on declared size, offsets, or field access"
    category: parsing
    severity: High
    severity_rationale:
      impact: "Potential out-of-bounds read on malformed frames; memory safety violation"
      probability: "Any received frame shorter than expected message offsets"
    status: OPEN
    owner: "services/remoteid"
    baseline:
      commit: "3f5b8b3ad6276bb04352596291d78b925ab699f5"
      evidence:
        - {location: "components/services/src/remoteid_decoder.c:decode_location", excerpt_hash: "no_per_field_bounds_check"}
        - {location: "components/services/src/remoteid_decoder.c:decode_basic_id", excerpt_hash: "no_bounds_memcpy"}
      reproduction:
        - "Pass a frame with valid header but truncated payload (e.g., 10 bytes instead of 25) to decode_single_message"
      observed_result: "decode_location reads at fixed offsets (up to byte 24) without verifying buffer has those bytes; relies solely on caller's minimum frame check"
    current_evidence:
      - {commit: "3f5b8b3", location: "components/services/src/remoteid_decoder.c:112-175"}
    root_cause: "Individual message decoders trust the caller's frame-level minimum check without per-field validation"
    remediation:
      strategy: "Validate minimum size, declared size, and each offset+field_size <= available_length before dereferencing; use parse-then-commit into staging"
      change_refs: []
    regression:
      test_ids: []
      defective_result: "Truncated frame causes out-of-bounds access (ASan detects)"
      remediated_result: "Truncated frame is rejected with observable error; no OOB access"
    requirements: ["5.1", "5.2", "5.7", "5.8", "12.1", "12.6"]
    verification:
      gates: {G2_host_fast: "pending", G3_security: "pending"}
      artifact_refs: []
    accepted_risk: null

