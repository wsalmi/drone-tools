  - id: CQR-NRF24-001
    title: "NRF24 always reads and publishes 32-byte payload regardless of actual width"
    category: parsing
    severity: High
    severity_rationale:
      impact: "Stale/residual bytes from previous packets exposed to consumers; incorrect payload length"
      probability: "Every reception — driver hardcodes NRF24_MAX_PAYLOAD_LEN (32)"
    status: OPEN
    owner: "hw_hal/nrf24"
    baseline:
      commit: "3f5b8b3ad6276bb04352596291d78b925ab699f5"
      evidence:
        - {location: "components/hw_hal/src/hal_nrf24.c:hal_nrf24_listen_channel:payload_read", excerpt_hash: "fixed_32_read"}
        - {location: "components/hw_hal/src/hal_nrf24.c:hal_nrf24_listen_channel:payload_len_set", excerpt_hash: "fixed_32_len"}
      reproduction:
        - "Inspect hal_nrf24_listen_channel(): nrf24_read_payload(packet->payload, NRF24_MAX_PAYLOAD_LEN) at line ~360; packet->payload_len = NRF24_MAX_PAYLOAD_LEN at line ~365"
      observed_result: "Always reads 32 bytes; always sets payload_len=32; no dynamic width query (R_RX_PL_WID) and no static width per pipe"
    current_evidence:
      - {commit: "3f5b8b3", location: "components/hw_hal/src/hal_nrf24.c:355-366"}
    root_cause: "Driver was designed for fixed 32-byte promiscuous sniffing; dynamic/static width modes not implemented"
    remediation:
      strategy: "Query R_RX_PL_WID in dynamic mode or use static_width[pipe] in static mode; validate width [1,32]; read only validated bytes; zero remainder"
      change_refs: []
    regression:
      test_ids: []
      defective_result: "Payload of 10 bytes is published as 32 bytes with stale residue"
      remediated_result: "Payload of 10 bytes has length=10; bytes [10,32) are zeroed; consumers respect length"
    requirements: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "8.7", "12.1", "12.4"]
    verification:
      gates: {G2_host_fast: "pending", G5_hil: "pending"}
      artifact_refs: []
    accepted_risk: null

