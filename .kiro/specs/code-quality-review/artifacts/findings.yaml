      reproduction:
        - "Inspect spectrum_analyzer_init(): only checks `if (sdr_status == HAL_STATUS_INACTIVE) return ESP_ERR_INVALID_STATE`"
        - "Any other state (ERROR, INITIALIZING) is accepted as 'available' and hal_sdr_init is called"
      observed_result: "SDR in ERROR state passes the check; spectrum init attempts hal_sdr_init which may fail or produce inconsistent state"
    current_evidence:
