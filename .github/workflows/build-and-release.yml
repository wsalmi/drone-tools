# ---------------------------------------------------------------------------
# Build and Release — CI Gates
# ---------------------------------------------------------------------------
# Mandatory gates: host-test, host-sanitizers, static-analysis, firmware-build.
# All four MUST pass for the PR to be accepted. The firmware build alone does
# NOT represent acceptance (Requirement 4.7, Property 4).
#
# Canonical commands match baseline.yaml — no alternative flow exists.
# continue-on-error is NOT used on mandatory gates.
#
# Temporary allowlist: skipped tests are visible in JUnit output and linked
# to findings (CQR-CI-*) in the findings inventory.
# ---------------------------------------------------------------------------

name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # =========================================================================
  # Gate G2a — Host configure, build, and test (baseline commands)
  # =========================================================================
  host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure host tests
        run: cmake -S test/host -B build/host

      - name: Build host tests
        run: cmake --build build/host

      - name: Run CTest (JUnit output)
        run: ctest --test-dir build/host --output-on-failure --output-junit results.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-junit
          path: build/host/results.xml

  # =========================================================================
  # Gate G2b — Host sanitizers (ASan + UBSan)
  # =========================================================================
  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure with ASan+UBSan
        run: cmake -S test/host -B build/host_asan -DSANITIZER=address

      - name: Build with ASan+UBSan
        run: cmake --build build/host_asan

      - name: Run CTest under ASan+UBSan (JUnit output)
        run: ctest --test-dir build/host_asan --output-on-failure --output-junit results_asan.xml

      - name: Upload sanitizer JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-sanitizers-junit
          path: build/host_asan/results_asan.xml

  # =========================================================================
  # Gate G3 — Static analysis and policy validators
  # =========================================================================
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install PyYAML

      - name: Configure host build (for compile_commands.json)
        run: cmake -S test/host -B build/host

      - name: Build host (capture build output)
        run: cmake --build build/host 2>&1 | tee build/host/build_output.log

      - name: Validate findings inventory
        run: python tools/code_quality/validate_findings.py

      - name: Validate policy
        run: python tools/code_quality/validate_policy.py

      - name: Check documentation references
        run: python tools/code_quality/check_doc_references.py

      - name: Run static analysis
        run: python tools/code_quality/static_analysis.py --build-dir build/host

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            build/host/build_output.log
            build/host/compile_commands.json

  # =========================================================================
  # Gate G4 — Firmware build (ESP-IDF v5.3, ESP32-S3)
  # =========================================================================
  firmware-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory /__w/drone-tools/drone-tools

      - name: Set target and build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build/firmware set-target esp32s3
          idf.py -B build/firmware build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware/drone-telemetry-monitor.bin
            build/firmware/bootloader/bootloader.bin
            build/firmware/partition_table/partition-table.bin
            build/firmware/flasher_args.json
            build/firmware/*.map

      - name: Upload firmware build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-log
          path: build/firmware/build.log

  # =========================================================================
  # Gate conjunction — All mandatory gates must pass before release
  # =========================================================================
  ci-gate:
    runs-on: ubuntu-latest
    needs: [host-test, host-sanitizers, static-analysis, firmware-build]
    steps:
      - name: All mandatory gates passed
        run: echo "All CI gates passed — host-test, host-sanitizers, static-analysis, firmware-build"

  # =========================================================================
  # Release — Only on main push, after all gates pass
  # =========================================================================
  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          # Generate version from date and short SHA
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            firmware/drone-telemetry-monitor.bin
            firmware/bootloader/bootloader.bin
            firmware/partition_table/partition-table.bin
            firmware/flasher_args.json
