# Simulated workflow with canonical commands that match baseline
name: Build and Test
on:
  push:
    branches: [main]
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: |
          rm -rf build/host && mkdir -p build/host
          cmake -S test/host -B build/host
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
  firmware-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build/firmware set-target esp32s3
          idf.py -B build/firmware build
